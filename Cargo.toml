[package]
name = "ferrum-chess"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Offline chess desktop application"
repository = "https://github.com/Alex2pankrat/ferrum-chess"

[dependencies]
iced = { version = "0.14", features = ["canvas", "svg", "tokio"] }
cozy-chess = { version = "0.3.4", features = ["std"] }
rfd = "0.15"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
