# Hand-maintained Windows pipeline using cargo-dist for the application build.
# The extra WiX steps include the separate Stockfish executable.
name: Windows validation and release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses for Windows dependencies
        run: cargo deny check licenses
      - name: Check version and tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = $metadata.packages | Where-Object name -eq 'ferrum-chess' | Select-Object -ExpandProperty version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Cargo version must be X.Y.Z for MSI' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must equal v plus Cargo.toml version' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Get Stockfish 17.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, release | Out-Null
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-windows-x86-64.zip' -OutFile stockfish.zip
          Expand-Archive stockfish.zip -DestinationPath stockfish-dist
          $engines = @(Get-ChildItem stockfish-dist -Recurse -Filter '*.exe')
          if ($engines.Count -ne 1) { throw "Expected one Stockfish executable, found $($engines.Count)" }
          Copy-Item $engines[0].FullName stage/stockfish.exe
          $license = Get-ChildItem stockfish-dist -Recurse -Filter Copying.txt | Select-Object -First 1
          if (!$license) { throw 'Stockfish GPL license missing from archive' }
          Copy-Item $license.FullName stage/Stockfish-GPL.txt
          "FERRUM_STOCKFISH=$pwd\stage\stockfish.exe" >> $env:GITHUB_ENV
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests, including Stockfish
        run: cargo test --all-targets
      - name: Install cargo-dist and WiX
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-x86_64-pc-windows-msvc.zip' -OutFile dist.zip
          Expand-Archive dist.zip -DestinationPath dist-tool
          $dist = Get-ChildItem dist-tool -Recurse -Filter dist.exe | Select-Object -First 1
          if (!$dist) { throw 'dist.exe missing from cargo-dist archive' }
          $dist.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet tool install --global wix --version 4.0.5
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows binary using cargo-dist
        shell: pwsh
        run: |
          dist build --tag="v$env:VERSION" --artifacts=local --target=x86_64-pc-windows-msvc --no-local-paths
          if ($LASTEXITCODE -ne 0) { throw 'cargo-dist build failed' }
          $app = 'target/x86_64-pc-windows-msvc/dist/ferrum-chess.exe'
          if (!(Test-Path $app)) { throw 'cargo-dist did not produce the expected executable' }
          Copy-Item $app stage/ferrum-chess.exe
      - name: Package portable app and engine source
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, assets/OFL.txt stage/
          Copy-Item stage/ferrum-chess.exe release/ferrum-chess.exe
          Copy-Item stage/stockfish.exe release/stockfish.exe
          Compress-Archive -Path stage/* -DestinationPath release/ferrum-chess-windows-portable.zip
          Copy-Item Cargo.lock release/Cargo.lock
          Copy-Item stockfish.zip release/stockfish-17.1-official.zip
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_17.1.zip' -OutFile release/stockfish-17.1-source.zip
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          wix build -arch x64 -d "Version=$env:VERSION" -d "AppPath=$pwd\stage\ferrum-chess.exe" -d "EnginePath=$pwd\stage\stockfish.exe" -d "StockfishLicense=$pwd\stage\Stockfish-GPL.txt" -d "FontLicense=$pwd\assets\OFL.txt" -d "Readme=$pwd\README.md" -d "MitLicense=$pwd\LICENSE-MIT" -d "ApacheLicense=$pwd\LICENSE-APACHE" wix/main.wxs -o release/ferrum-chess-x64.msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX build failed' }
      - name: Smoke-test install, engine and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path release/ferrum-chess-x64.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed: $($p.ExitCode)" }
          $dir = "${env:ProgramFiles}\Ferrum Chess"
          if (!(Test-Path "$dir\ferrum-chess.exe") -or !(Test-Path "$dir\stockfish.exe")) { throw 'Installed files missing' }
          $reply = @('uci', 'isready', 'quit') | & "$dir\stockfish.exe"
          if (($reply -join "`n") -notmatch 'readyok') { throw 'Installed Stockfish UCI smoke test failed' }
          $env:FERRUM_STOCKFISH = "$dir\stockfish.exe"
          cargo test --test game_flow stockfish_returns_a_legal_move_when_configured
          if ($LASTEXITCODE -ne 0) { throw 'Installed Stockfish integration test failed' }
          $app = Start-Process "$dir\ferrum-chess.exe" -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited immediately: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$dir\ferrum-chess.exe") { throw 'Executable remains after uninstall' }
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-chess-windows
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --title "Ferrum Chess $env:VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
    permissions:
      contents: write
