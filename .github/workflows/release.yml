# Hand-maintained Windows pipeline using cargo-dist for the application build.
# The extra WiX steps include the separate Stockfish executable.
name: Windows validation and release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses for Windows dependencies
        run: cargo deny check licenses
      - name: Check version and tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = $metadata.packages | Where-Object name -eq 'ferrum-chess' | Select-Object -ExpandProperty version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Cargo version must be X.Y.Z for MSI' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must equal v plus Cargo.toml version' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Get Stockfish 17.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, release | Out-Null
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-windows-x86-64.zip' -OutFile stockfish.zip
          Expand-Archive stockfish.zip -DestinationPath stockfish-dist
          $engines = @(Get-ChildItem stockfish-dist -Recurse -Filter '*.exe')
          if ($engines.Count -ne 1) { throw "Expected one Stockfish executable, found $($engines.Count)" }
          Copy-Item $engines[0].FullName stage/stockfish.exe
          $license = Get-ChildItem stockfish-dist -Recurse -Filter Copying.txt | Select-Object -First 1
          if (!$license) { throw 'Stockfish GPL license missing from archive' }
          Copy-Item $license.FullName stage/Stockfish-GPL.txt
          "FERRUM_STOCKFISH=$pwd\stage\stockfish.exe" >> $env:GITHUB_ENV
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: pwsh
        run: |
          $lines = @(cargo clippy --all-targets -- -D warnings 2>&1)
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output "$_" }
          if ($code -ne 0) {
            $lines | Select-Object -Last 100 | ForEach-Object {
              $message = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $code
          }
      - name: Unit and integration tests, including Stockfish
        shell: pwsh
        run: |
          $lines = @(cargo test --all-targets 2>&1)
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output "$_" }
          if ($code -ne 0) {
            $lines | Select-Object -Last 100 | ForEach-Object {
              $message = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $code
          }
      - name: Install cargo-dist and WiX
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-x86_64-pc-windows-msvc.zip' -OutFile dist.zip
          Expand-Archive dist.zip -DestinationPath dist-tool
          $dist = Get-ChildItem dist-tool -Recurse -Filter dist.exe | Select-Object -First 1
          if (!$dist) { throw 'dist.exe missing from cargo-dist archive' }
          $dist.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet tool install --global wix --version 4.0.5
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $wixTools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $wixTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $wixTools 'wix.exe') extension add --global WixToolset.UI.wixext/4.0.5
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
      - name: Build Windows binary using cargo-dist
        shell: pwsh
        run: |
          dist build --tag="v$env:VERSION" --artifacts=local --target=x86_64-pc-windows-msvc --no-local-paths
          if ($LASTEXITCODE -ne 0) { throw 'cargo-dist build failed' }
          $app = 'target/x86_64-pc-windows-msvc/dist/ferrum-chess.exe'
          if (!(Test-Path $app)) { throw 'cargo-dist did not produce the expected executable' }
          Copy-Item $app stage/ferrum-chess.exe
      - name: Self-test packaged portable app with adjacent Stockfish
        shell: pwsh
        run: |
          # Do not let the test-only override hide a broken adjacent-engine lookup.
          Remove-Item Env:FERRUM_STOCKFISH -ErrorAction SilentlyContinue
          $p = Start-Process ./stage/ferrum-chess.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Portable application self-test failed: $($p.ExitCode)" }
      - name: Package portable app and engine source
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, assets/OFL.txt stage/
          Copy-Item assets/pieces/livius/LICENSE stage/Chess-Pieces-Public-Domain.txt
          Copy-Item stage/ferrum-chess.exe release/ferrum-chess.exe
          Copy-Item stage/stockfish.exe release/stockfish.exe
          Compress-Archive -Path stage/* -DestinationPath release/ferrum-chess-windows-portable.zip
          Copy-Item Cargo.lock release/Cargo.lock
          Copy-Item stockfish.zip release/stockfish-17.1-official.zip
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_17.1.zip' -OutFile release/stockfish-17.1-source.zip
      - name: Verify portable and Stockfish archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Assert-ZipEntries($path, $patterns) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path).Path)
            try {
              foreach ($pattern in $patterns) {
                if (!($zip.Entries | Where-Object { $_.FullName -match $pattern } | Select-Object -First 1)) {
                  throw "Missing entry matching $pattern in $path"
                }
              }
            } finally { $zip.Dispose() }
          }
          Assert-ZipEntries 'release/ferrum-chess-windows-portable.zip' @('(^|/)ferrum-chess\.exe$', '(^|/)stockfish\.exe$', '(^|/)Stockfish-GPL\.txt$', '(^|/)LICENSE-MIT$', '(^|/)LICENSE-APACHE$', '(^|/)OFL\.txt$', '(^|/)Chess-Pieces-Public-Domain\.txt$')
          Assert-ZipEntries 'release/stockfish-17.1-source.zip' @('(^|/)src/uci\.cpp$', '(^|/)Copying\.txt$')
          Assert-ZipEntries 'release/stockfish-17.1-official.zip' @('(^|/)src/uci\.cpp$', '(^|/)Copying\.txt$')
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          # The wizard displays the complete MIT, Apache and Stockfish GPL notices.
          $notice = @(
            'Ferrum Chess is licensed under MIT OR Apache-2.0, at your option. Stockfish is a separate executable under GPL-3.0-or-later. Source: https://github.com/official-stockfish/Stockfish/tree/sf_17.1',
            '--- MIT LICENSE ---', (Get-Content LICENSE-MIT -Raw),
            '--- APACHE LICENSE ---', (Get-Content LICENSE-APACHE -Raw),
            '--- STOCKFISH GPL LICENSE ---', (Get-Content stage/Stockfish-GPL.txt -Raw)
          ) -join "`n`n"
          $escaped = $notice.Replace('\', '\\').Replace('{', '\{').Replace('}', '\}').Replace("`r`n", "`n").Replace("`n", "\par`n")
          $rtf = '{\rtf1\ansi\deff0 {\fonttbl{\f0 Arial;}}\f0\fs18 ' + $escaped + '}'
          [IO.File]::WriteAllText("$pwd\stage\licenses.rtf", $rtf, [Text.Encoding]::ASCII)
          wix build -arch x64 -ext WixToolset.UI.wixext -d "Version=$env:VERSION" -d "AppIcon=$pwd\assets\ferrum-icon.ico" -d "AppPath=$pwd\stage\ferrum-chess.exe" -d "EnginePath=$pwd\stage\stockfish.exe" -d "StockfishLicense=$pwd\stage\Stockfish-GPL.txt" -d "FontLicense=$pwd\assets\OFL.txt" -d "PieceNotice=$pwd\stage\Chess-Pieces-Public-Domain.txt" -d "Readme=$pwd\README.md" -d "MitLicense=$pwd\LICENSE-MIT" -d "ApacheLicense=$pwd\LICENSE-APACHE" -d "LicenseRtf=$pwd\stage\licenses.rtf" wix/main.wxs -o release/ferrum-chess-x64.msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX build failed' }
      - name: Verify MSI wizard dialogs and UI sequence
        shell: pwsh
        run: |
          $msi = (Resolve-Path release/ferrum-chess-x64.msi).Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          foreach ($dialog in @('DesktopShortcutDlg', 'WelcomeEulaDlg', 'ProgressDlg', 'ExitDialog', 'FatalError')) {
            $sql = 'SELECT `Dialog` FROM `Dialog` WHERE `Dialog` = ' + "'" + $dialog + "'"
            $view = $db.OpenView($sql)
            $view.Execute()
            if (!$view.Fetch()) { throw "Missing MSI dialog: $dialog" }
            $view.Close()
          }
          foreach ($action in @('DesktopShortcutDlg', 'WelcomeEulaDlg', 'ExitDialog')) {
            $sql = 'SELECT `Action` FROM `InstallUISequence` WHERE `Action` = ' + "'" + $action + "'"
            $view = $db.OpenView($sql)
            $view.Execute()
            if (!$view.Fetch()) { throw "Missing MSI UI action: $action" }
            $view.Close()
          }
      - name: Check Windows GUI subsystem and executable icon
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path stage/ferrum-chess.exe).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550) { throw 'Invalid PE signature' }
          if ([BitConverter]::ToUInt16($bytes, $pe + 24 + 68) -ne 2) { throw 'Executable is not a Windows GUI subsystem application' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path stage/ferrum-chess.exe).Path)
          if (!$icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()
      - name: Verify desktop shortcut installer configuration
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase((Resolve-Path release/ferrum-chess-x64.msi).Path, 0)
          $view = $db.OpenView("SELECT ``Property`` FROM ``Control`` WHERE ``Dialog_`` = 'DesktopShortcutDlg' AND ``Control`` = 'DesktopCheckbox'")
          $view.Execute()
          $record = $view.Fetch()
          if (!$record -or $record.StringData(1) -ne 'DESKTOPSHORTCUT') { throw 'Desktop shortcut checkbox is not configured' }
          $view.Close()
          $view = $db.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'SecureCustomProperties'")
          $view.Execute()
          $record = $view.Fetch()
          if (!$record -or ($record.StringData(1) -split ';') -notcontains 'DESKTOPSHORTCUT') { throw 'Desktop choice is not propagated to elevated installation' }
          $view.Close()
          $sequences = @{}
          foreach ($action in @('DesktopShortcutDlg', 'WelcomeEulaDlg')) {
            $view = $db.OpenView("SELECT ``Sequence`` FROM ``InstallUISequence`` WHERE ``Action`` = '$action'")
            $view.Execute()
            $record = $view.Fetch()
            if (!$record) { throw "Missing UI sequence action $action" }
            $sequences[$action] = $record.IntegerData(1)
            $view.Close()
          }
          if ($sequences['DesktopShortcutDlg'] -ge $sequences['WelcomeEulaDlg']) { throw 'Desktop choice is not before the welcome/license dialog' }
      - name: Smoke-test install, engine and uninstall
        shell: pwsh
        run: |
          # Verify that the new installer upgrades the previously published 0.2.0 MSI.
          Invoke-WebRequest 'https://github.com/Alex2pankrat/ferrum-chess/releases/download/v0.2.0/ferrum-chess-x64.msi' -OutFile old-version.msi
          $oldMsi = (Resolve-Path old-version.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$oldMsi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Previous MSI install failed: $($p.ExitCode)" }
          $msi = (Resolve-Path release/ferrum-chess-x64.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", 'DESKTOPSHORTCUT=1', '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed: $($p.ExitCode)" }
          $installed = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Ferrum Chess')
          if ($installed.Count -ne 1 -or $installed[0].DisplayVersion -ne $env:VERSION) { throw 'MSI upgrade did not replace the previous version' }
          $dir = "${env:ProgramFiles}\Ferrum Chess"
          if (!(Test-Path "$dir\ferrum-chess.exe") -or !(Test-Path "$dir\stockfish.exe")) { throw 'Installed files missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Ferrum Chess\Ferrum Chess.lnk'
          if (!(Test-Path $shortcut)) { throw "Start menu shortcut missing: $shortcut" }
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Ferrum Chess.lnk'
          if (!(Test-Path $desktop)) { throw 'Selected desktop shortcut missing' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($desktop)
          if ($link.TargetPath -ine "$dir\ferrum-chess.exe") { throw "Desktop shortcut target is wrong: $($link.TargetPath)" }
          $reply = @('uci', 'isready', 'quit') | & "$dir\stockfish.exe"
          if (($reply -join "`n") -notmatch 'readyok') { throw 'Installed Stockfish UCI smoke test failed' }
          $env:FERRUM_STOCKFISH = "$dir\stockfish.exe"
          cargo test --test game_flow stockfish_returns_a_legal_move_when_configured
          if ($LASTEXITCODE -ne 0) { throw 'Installed Stockfish integration test failed' }
          Remove-Item Env:FERRUM_STOCKFISH -ErrorAction SilentlyContinue
          $p = Start-Process "$dir\ferrum-chess.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed app self-test with adjacent Stockfish failed: $($p.ExitCode)" }
          foreach ($file in @('LICENSE-MIT.txt', 'LICENSE-APACHE.txt', 'Stockfish-GPL.txt', 'Noto-OFL.txt', 'Chess-Pieces-Public-Domain.txt')) {
            if (!(Test-Path (Join-Path $dir $file))) { throw "Installed license missing: $file" }
          }
          $app = Start-Process "$dir\ferrum-chess.exe" -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited immediately: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          foreach ($file in @('ferrum-chess.exe', 'stockfish.exe')) {
            if (Test-Path (Join-Path $dir $file)) { throw "File remains after uninstall: $file" }
          }
          if (Test-Path $shortcut) { throw 'Start menu shortcut remains after uninstall' }
          if (Test-Path $desktop) { throw 'Desktop shortcut remains after uninstall' }
          # Silent install without the option must not create a desktop shortcut.
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Default MSI install failed: $($p.ExitCode)" }
          if (Test-Path $desktop) { throw 'Desktop shortcut was created without opting in' }
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Default MSI uninstall failed: $($p.ExitCode)" }
      - name: Create and verify SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Sort-Object Name)
          if ($files.Count -eq 0) { throw 'No release files to checksum' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines("$pwd\release\SHA256SUMS.txt", [string[]]$lines, [Text.Encoding]::ASCII)
          foreach ($line in $lines) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash (Join-Path 'release' $name) -Algorithm SHA256).Hash -ine $hash) { throw "Checksum mismatch: $name" }
          }
      - name: Upload MSI for testing
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-chess-msi
          path: release/ferrum-chess-x64.msi
          if-no-files-found: error
      - name: Upload other test packages
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-chess-windows-other
          path: |
            release/*
            !release/*.msi
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ferrum-chess-msi
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ferrum-chess-windows-other
          path: release
      - name: Verify downloaded assets before publishing
        shell: pwsh
        run: |
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            if (!$name -or !(Test-Path (Join-Path 'release' $name))) { throw "Missing asset: $name" }
            if ((Get-FileHash (Join-Path 'release' $name) -Algorithm SHA256).Hash -ine $hash) { throw "Checksum mismatch: $name" }
          }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --title "Ferrum Chess $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
